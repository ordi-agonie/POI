<!DOCTYPE html>
<html lang="fr-BE">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  
  <header>
    <h1>POI</h1>
  </header>
  
  <main>
    
    <section id="liste-poi">
      <!-- Les POI seront affichés ici -->
      <article class="poi">
        <p class="poi-contenu">
            "je cite du vide."
        </p>
        <div class="poi-meta">
          <span>Auteur : Inconnu</span>
          <span>06/08/2026</span>
        </div>
      </article>
    </section>

    <section id="formulaire-poi" hidden>
      <textarea
        id="contenu-poi" 
        placeholder="Votre POI">
      </textarea>
      <textarea
        id="raison-conservation-poi" 
        placeholder="Pourquoi je garde ce POI ? (facultatif)">
      </textarea>

      <label>
        <input type="checkbox" id="favori-poi">
        Favori
      </label>
      <button id="annuler-poi">Annuler</button>
      <button id="enregistrer-poi">
        Enregistrer
      </button>
    </section>
    
    <button id="nouveau-poi" aria-label="Ajouter un POI">
      +
    </button>
  
  </main>
  
</body>
</html>
