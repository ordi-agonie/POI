<!DOCTYPE html>
<html lang="fr-BE">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>

<body>
  
  <header>
    <h1>POI</h1>
    <label for="recherche-poi">Rechercher</label>
    <input
      id="recherche-poi"
      type="search"
      placeholder="Rechercher dans les POI"
    >
  </header>
  
  <main>
    <section id="poi-du-jour">
      <h2>POI du jour</h2>
      <article id="poi-du-jour-contenu">
      </article>
    </section>
    
    <section id="parcours-poi">
      <h2>Parcours aléatoire</h2>
      <article id="parcours-poi-contenu"></article>
      <button id="suivant-poi">Suivant</button>
    </section>
    
    <section id="liste-poi">
      <!-- Les POI seront affichés ici -->
      <article class="poi">
        <p class="poi-contenu">
            "je cite du vide."
        </p>
        <div class="poi-meta">
          <span>Auteur : Inconnu</span>
          <span>06/08/2026</span>
        </div>
      </article>
    </section>

    <button id="exporter-pois">Exporter les POI</button>
    <input
      id="importer-pois"
      type="file"
      accept=".json,application/json"
    >

    <section id="formulaire-poi" hidden>
      <textarea
        id="contenu-poi" 
        placeholder="Votre POI">
      </textarea>
      <textarea
        id="raison-conservation-poi" 
        placeholder="Pourquoi je garde ce POI ? (facultatif)">
      </textarea>
      <textarea
        id="notes-poi"
        placeholder="Notes complémentaires (facultatif)">
      </textarea>
      <details id="origine-details">
        <summary>Origine</summary>
        <select id="origine-type">
          <option value="">Type de source</option>
          <option value="article">Article</option>
          <option value="livre">Livre</option>
          <option value="emission">Émission</option>
          <option value="video">Vidéo</option>
          <option value="document">Document</option>
          <option value="site">Site</option>
        </select>
        <input id="origine-format" placeholder="Format">
        <input id="origine-source" placeholder="Source">
        <input id="origine-titre" placeholder="Titre">
        <input id="origine-auteur" placeholder="Auteur">
        <input id="origine-date" placeholder="Date">
        <input id="origine-numero" placeholder="Numéro">
        <input id="origine-lien" placeholder="Lien">
      </details>

      <details id="reference-details">
        <summary>Référence</summary>

        <select id="reference-type">
          <option value="">Type de source</option>
          <option value="article">Article</option>
          <option value="livre">Livre</option>
          <option value="emission">Émission</option>
          <option value="video">Vidéo</option>
          <option value="document">Document</option>
          <option value="site">Site</option>
        </select>
        <input id="reference-format" placeholder="Format">
        <input id="reference-source" placeholder="Source">
        <input id="reference-titre" placeholder="Titre">
        <input id="reference-auteur" placeholder="Auteur">
        <input id="reference-date" placeholder="Date">
        <input id="reference-numero" placeholder="Numéro">
        <input id="reference-lien" placeholder="Lien">
      </details>

      <details id="decouverte-details">
        <summary>Découverte</summary>

        <select id="decouverte-type">
          <option value="">Type de source</option>
          <option value="article">Article</option>
          <option value="livre">Livre</option>
          <option value="emission">Émission</option>
          <option value="video">Vidéo</option>
          <option value="document">Document</option>
          <option value="site">Site</option>
        </select>
        <input id="decouverte-format" placeholder="Format">
        <input id="decouverte-source" placeholder="Source">
        <input id="decouverte-titre" placeholder="Titre">
        <input id="decouverte-auteur" placeholder="Auteur">
        <input id="decouverte-date" placeholder="Date">
        <input id="decouverte-numero" placeholder="Numéro">
        <input id="decouverte-lien" placeholder="Lien">
      </details>
      <label>
        <input type="checkbox" id="favori-poi">
        Favori
      </label>
      <button id="annuler-poi">Annuler</button>
      <button id="enregistrer-poi">
        Enregistrer
      </button>
    </section>
    
    <button id="nouveau-poi" aria-label="Ajouter un POI">
      +
    </button>
  
  </main>
  
</body>
</html>
