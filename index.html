<!DOCTYPE html>
<html lang="fr-BE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POI</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header>
        <h1>POI</h1>
    </header>

    <main>

        <section id="liste-poi">

            <article class="poi">
                <p class="poi-contenu">
            "je cite du vide."

                <div class="poi-meta">

        </section>

    </main>

    <button id="nouveau-poi" aria-label="Ajouter un POI">
        +
    </button>

</html>
